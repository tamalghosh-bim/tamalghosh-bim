<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: "IBM Plex Sans", sans-serif; color: #0F1B2D;
    background-color: #F6F4EF;
    background-image: linear-gradient(rgba(15,27,45,.10) 1px, transparent 1px), linear-gradient(90deg, rgba(15,27,45,.10) 1px, transparent 1px),
      linear-gradient(rgba(15,27,45,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(15,27,45,.035) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
  .label { position: absolute; left: 80px; top: 78px; font: 500 18px "IBM Plex Mono", monospace; letter-spacing: .16em; color: #657082; }
  .label b { color: #A9521A; font-weight: 600; }
  h1 { position: absolute; left: 76px; top: 120px; margin: 0; font-size: 128px; line-height: .92; letter-spacing: -.05em; font-weight: 600; }
  h1 i { color: #E07A2F; font-style: normal; }
  .sub { position: absolute; left: 80px; top: 386px; font-size: 30px; color: #33404F; max-width: 640px; line-height: 1.35; }
  .photo { position: absolute; right: 80px; top: 92px; width: 330px; padding: 12px; background: #fff; border: 1.5px solid #0F1B2D; box-shadow: 14px 14px 0 #E5E1D6; }
  .photo img { width: 100%; display: block; }
  .crop { position: absolute; width: 20px; height: 20px; border: 0 solid #E07A2F; }
  .tl { left: -10px; top: -10px; border-left-width: 3px; border-top-width: 3px; }
  .br { right: -10px; bottom: -10px; border-right-width: 3px; border-bottom-width: 3px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: #0F1B2D; color: #DCE6F2; display: flex; align-items: center; padding: 0 80px; gap: 40px; font: 500 18px "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  .bar span:first-child { color: #fff; }
  .bar i { width: 10px; height: 10px; background: #E07A2F; transform: rotate(45deg); display: inline-block; }
</style>
</head>
<body>
  <div class="label"><b>01</b> — INFRASTRUCTURE BIM ENGINEER</div>
  <h1>Tamal<br>Ghosh<i>.</i></h1>
  <div class="sub">Civil 3D utilities &amp; highways, clash coordination and AI-assisted BIM automation.</div>
  <div class="photo"><span class="crop tl"></span><span class="crop br"></span><img src="../assets/tamal-ghosh.jpg" alt=""></div>
  <div class="bar"><span>tamalghosh.com</span><i></i><span>Abu Dhabi, UAE</span><i></i><span>Parsons</span></div>
</body>
</html>
